name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  app:
    name: Lint · types · build · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - name: Build (type-checks via tsc -b)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-not-a-real-key
      - run: npm run test

  database:
    name: Migrations · RLS policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }

      - name: Start Supabase
        run: supabase start

      # Ticket 0.7 — the Phase 0 gate. A tenancy leak fails the build.
      - name: RLS isolation tests (pgTAP)
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee /tmp/pgtap.log

      # Reading a run log needs an authenticated token, and a job summary is not
      # exposed by the API. Annotations are, so the salient pgTAP lines are
      # emitted as ::error:: to make a red gate diagnosable from the outside.
      # (GitHub keeps at most 10 annotations per step.)
      - name: Surface pgTAP failures as annotations
        if: failure()
        run: |
          grep -E 'not ok|ERROR:|Bad plan|Parse errors|Failed [0-9]+/' /tmp/pgtap.log \
            | head -10 \
            | while IFS= read -r line; do echo "::error::${line}"; done || true

      - name: Publish pgTAP output to the job summary
        if: always()
        run: |
          {
            echo '### pgTAP output'
            echo '```'
            tail -c 8000 /tmp/pgtap.log 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check committed types match the schema
        run: |
          supabase gen types typescript --local > /tmp/generated.ts
          if ! diff -q /tmp/generated.ts src/types/database.types.ts; then
            echo "::error::src/types/database.types.ts is stale. Run: npm run types:gen"
            diff -u src/types/database.types.ts /tmp/generated.ts | head -60
            exit 1
          fi
