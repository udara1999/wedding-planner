name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  app:
    name: Lint · types · build · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - name: Build (type-checks via tsc -b)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-not-a-real-key
      - run: npm run test

  database:
    name: Migrations · RLS policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }

      - name: Start Supabase
        run: supabase start

      # Ticket 0.7 — the Phase 0 gate. A tenancy leak fails the build.
      - name: RLS isolation tests (pgTAP)
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee /tmp/pgtap.log

      # The pgTAP output is the only description of *which* assertion failed,
      # and reading a run log needs an authenticated token. Copying it into the
      # job summary publishes it through the check-runs API instead, so a
      # failure can be diagnosed without downloading anything.
      - name: Publish pgTAP output to the job summary
        if: always()
        run: |
          {
            echo '### pgTAP output'
            echo '```'
            tail -c 8000 /tmp/pgtap.log 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check committed types match the schema
        run: |
          supabase gen types typescript --local > /tmp/generated.ts
          if ! diff -q /tmp/generated.ts src/types/database.types.ts; then
            echo "::error::src/types/database.types.ts is stale. Run: npm run types:gen"
            diff -u src/types/database.types.ts /tmp/generated.ts | head -60
            exit 1
          fi
