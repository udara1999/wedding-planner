<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Wedding Planner</title>
    <!-- Ticket 8.7. The manifest makes the app installable; the service
         worker in public/sw.js keeps the shell available with no signal. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6e1e2e" />
    <!-- iOS ignores the manifest for the home-screen icon and the standalone
         flag, so both are declared again the way Safari wants them. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wedding" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
