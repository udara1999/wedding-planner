<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ====================================================================
         SEO
         ====================================================================
         Only one route in this app is public: this one. Everything else is
         either behind sign-in or is a tokenised RSVP link, and robots.txt
         (generated in vite.config.ts) forbids all of it.

         These tags are static rather than set by React on mount because no
         social scraper executes JavaScript — Facebook, WhatsApp, LinkedIn,
         Slack and iMessage all read the raw HTML and stop. A title set in a
         useEffect is invisible to every one of them.
         ================================================================== -->
    <title>MangalaHub — Sri Lankan wedding planner for your Mangala day</title>
    <meta
      name="description"
      content="Every rupee, every vendor, every guest and every hour of the day itself, in one place your whole family can use. A poruwa running order, a budget kept in cents, RSVP links per household, and a day-of pack that prints."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph. og:url must be absolute or the preview resolves nothing. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MangalaHub" />
    <meta
      property="og:title"
      content="MangalaHub — Sri Lankan wedding planner for your Mangala day"
    />
    <meta
      property="og:description"
      content="Your journey to the perfect Mangala day: a poruwa running order, a budget that tracks quoted against actual, RSVP links for every household, and a day-of pack that works with no signal."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MangalaHub — Sri Lankan wedding planner" />
    <meta property="og:locale" content="en_LK" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="MangalaHub — Sri Lankan wedding planner for your Mangala day"
    />
    <meta
      name="twitter:description"
      content="Your journey to the perfect Mangala day: a poruwa running order, a budget that tracks quoted against actual, RSVP links for every household, and a day-of pack that works with no signal."
    />
    <meta name="twitter:image" content="%SITE_URL%/icons/og-image.png" />

    <!-- Ticket 8.7. The manifest makes the app installable; the service
         worker in public/sw.js keeps the shell available with no signal. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6e1e2e" />
    <!-- iOS ignores the manifest for the home-screen icon and the standalone
         flag, so both are declared again the way Safari wants them. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MangalaHub" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- Cormorant Garamond carries every display heading and Inter the body.
         --font-sans in index.css has named Inter since the beginning but
         nothing ever loaded it, so the app was falling back to the system UI
         font. The preconnects matter more than usual here: the landing page's
         first paint is a serif headline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Supabase is the only third party and every screen needs it, so the
         connection is warmed rather than waited for. -->
    <link rel="preconnect" href="https://ejrsxxxvlxdarmmfgsku.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://ejrsxxxvlxdarmmfgsku.supabase.co" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "MangalaHub",
            "inLanguage": "en",
            "description": "Plan a Sri Lankan wedding in one place: poruwa checklist, budget, guest list and RSVPs, vendors, and a printable day-of pack."
          },
          {
            "@type": "SoftwareApplication",
            "@id": "%SITE_URL%/#app",
            "name": "MangalaHub",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Any modern browser; installable on iOS and Android",
            "url": "%SITE_URL%/",
            "inLanguage": "en",
            "featureList": [
              "Poruwa ceremony running order and registration checklist",
              "Budget with quoted, negotiated and actual amounts per line",
              "Payment schedule with due and overdue tracking",
              "Household guest list with tokenised RSVP links",
              "Seating plan with capacity checks",
              "Vendor comparison across 227 questions",
              "Printable day-of pack that works without a signal",
              "Export everything to a spreadsheet"
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "%SITE_URL%/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is it only for Sri Lankan weddings?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. The Buddhist Poruwa template is the most complete one because that is where the content came from, but Christian, Hindu, Muslim and generic templates use the same engine. The tradition is data, not code."
                }
              },
              {
                "@type": "Question",
                "name": "Can I bring my existing spreadsheet in?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Guests import from CSV today. For the budget, most couples find the template already covers what their sheet had, and renaming lines is quicker than mapping columns."
                }
              },
              {
                "@type": "Question",
                "name": "What if we change the wedding date?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Every task, appointment and countdown item is stored as an offset from the wedding day rather than as a fixed date. Change the date in Setup and the whole plan moves with it. Anything you dated by hand stays where you put it."
                }
              },
              {
                "@type": "Question",
                "name": "Can our coordinator really not see the money?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Correct. Financial tables return no rows at all for the coordinator role \u2014 not blurred, not hidden in the interface, simply not sent. Screens that mix money with operations use a separate operations-facing view."
                }
              },
              {
                "@type": "Question",
                "name": "How many guests can it handle?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Guests are grouped by household, and each household gets one RSVP link. A thousand-guest list is a few hundred links, which is well within what the RSVP endpoint is rate-limited for."
                }
              }
            ]
          }
        ]
      }
    </script>
    <!-- ====================================================================
         The prerendered landing page, and when NOT to show it
         ====================================================================
         #root below holds the landing page, rendered at build time. That is
         the right content for exactly one case: a visitor's first arrival at
         "/". But this same index.html is served for every URL in the app by
         the SPA fallback, and to people who are already signed in — so on
         /w/<id>/budget, or for a signed-in couple opening "/", the
         prerendered hero is the wrong page and must not paint at all.

         Both halves are inline and in the head deliberately. The script runs
         while the head is still parsing, long before #root exists, and the
         rule has to be here rather than in index.css because in development
         that stylesheet is injected by JavaScript — by which time the bundle
         has already run and the moment has passed.

         src/main.tsx removes the attribute once it has cleared the markup. -->
    <style>
      [data-hide-prerender] #root {
        visibility: hidden;
      }
    </style>
    <script>
      (function () {
        var signedIn = false;
        try {
          // Supabase persists its session under sb-<project-ref>-auth-token.
          for (var i = 0; i < localStorage.length; i += 1) {
            var key = localStorage.key(i);
            if (key && key.indexOf('sb-') === 0 && key.indexOf('-auth-token') > 0) {
              signedIn = true;
            }
          }
        } catch (e) {
          // A private window denies localStorage. Briefly showing the landing
          // page is the harmless side of this decision, so nothing to do.
        }
        if (signedIn || location.pathname !== '/') {
          document.documentElement.setAttribute('data-hide-prerender', '');
        }
      })();
    </script>
  </head>
  <body>
    <!-- The landing page is rendered here at build time by
         scripts/prerender.mjs, from the same component the app renders, so the
         two cannot drift. In development this is empty and React fills it.

         Not hydrated: see src/main.tsx for why. -->
    <div id="root"><!--prerender--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
