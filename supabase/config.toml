project_id = "wedding-planner"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/auth/reset",
  "http://localhost:5173/invite",
]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# First-time sign-up must confirm the address before the account can sign in.
enable_confirmations = true

[inbucket]
enabled = true
port = 54324

# Ticket 4.7. The guard in front of the public RSVP RPCs.
#
# verify_jwt stays ON: guests have no account, but the browser sends the
# project's anon key, which keeps the endpoint off the open internet without
# asking a guest to sign in. It is one barrier among several, not the barrier.
[functions.rsvp]
verify_jwt = true

# Ticket 4.10. Sends invitations by email through Resend.
#
# verify_jwt ON, and no service role key inside: the function reads and writes
# as the caller, so row-level security decides which households it can see and
# mark. That is what stops it being a mail relay.
[functions.invite]
verify_jwt = true
